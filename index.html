<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080709" />
    <title>SHROUD // WhatsApp Sticker Forge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (!window.crossOriginIsolated && 'serviceWorker' in navigator && window.isSecureContext) {
        navigator.serviceWorker.register('./coi-serviceworker.js').then((reg) => {
          if (reg.active && !navigator.serviceWorker.controller) {
            window.location.reload();
          }
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'activated' && !navigator.serviceWorker.controller) {
                window.location.reload();
              }
            });
          });
        }).catch(() => {});
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
